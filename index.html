<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Cova Vault organizes credentials, notes, tasks, PeraLog, wallet, savings, folders, favorites, and calendar in one personal vault. Android available, Windows coming soon." />
    <title>Cova Vault — Your personal vault</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('cova-theme');
          var mode = stored === 'dark' || stored === 'light' ? stored : null;
          if (!mode) {
            mode = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          if (mode === 'light') document.documentElement.classList.add('light');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
